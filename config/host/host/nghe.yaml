docker:
  images:
    remote:
      nghe:
        repo: ghcr.io/vnghia/nghe
        tag: "0.16.1"
  volumes:
    local:
      nghe-musics: {}
      nghe-music: {}
      nghe-cache: {}
services:
  nghe:
    config:
      traefik:
        dynamic:
          traefik:
            record: solar
            service:
              port:
                env: NGHE__SERVER__PORT
    databases:
      postgres:
        postgres: {}
    secrets:
      key:
        length: 16
    container:
      image: nghe
      databases:
        - postgres:
          envs:
            env: NGHE__DATABASE__URL
      healthcheck: {}
      network:
        bridge:
          direct: {}
      volumes:
        nghe-music:
          path: /music
          read-only: true
        nghe-musics:
          path: /media/musics/media
          read-only: true
        nghe-cache: /tmp/nghe
      envs:
        NGHE__SERVER__PORT: 3000
        NGHE__DATABASE__KEY:
          extract:
            secret: key
          transform:
            secret:
              encode: hex
        NGHE__LOG__TIME: false
        NGHE__LOG__FORMAT: json
        NGHE__S3__ENABLE: true
        NGHE__INTEGRATION__SPOTIFY__ID:
        NGHE__INTEGRATION__SPOTIFY__SECRET:
        NGHE__INTEGRATION__LASTFM__KEY:
