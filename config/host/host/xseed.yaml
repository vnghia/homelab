docker:
  images:
    remote:
      xseed:
        repo: ghcr.io/cross-seed/cross-seed
        tag: "6.13.7"
  volumes:
    local:
      xseed-config:
        backup:
          sqlite:
            dbs:
              - cross-seed.db
services:
  xseed:
    variables:
      XSEED_PORT: 2468
    config:
      traefik:
        dynamic:
          traefik:
            service:
              port:
                svariable: XSEED_PORT
    container:
      image: xseed
      command:
        - daemon
        - --port
        - svariable: XSEED_PORT
      hosts:
        - hostname: qbittorrent
        - hostname: starr-radarr
        - hostname: starr-sonarr
        - hostname: starr-prowlarr
      volumes:
        xseed-config: /config
        qbittorrent-games:
          service: qbittorrent
          extract:
            container:
            extract:
              volume: qbittorrent-games
        qbittorrent-musics:
          service: qbittorrent
          extract:
            container:
            extract:
              volume: qbittorrent-musics
        starr-movies-torrents:
          service: qbittorrent
          extract:
            container:
            extract:
              volume: starr-movies-torrents
        starr-shows-torrents:
          service: qbittorrent
          extract:
            container:
            extract:
              volume: starr-shows-torrents
