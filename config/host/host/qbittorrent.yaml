docker:
  images:
    remote:
      qbittorrent:
        repo: ghcr.io/linuxserver/qbittorrent
        tag: "5.2.4"
  volumes:
    local:
      qbittorrent-config: {}
      qbittorrent-archives:
        backup:
          repository: iso
      qbittorrent-books:
        backup:
          repository: iso
      qbittorrent-documents:
        backup:
          repository: iso
      qbittorrent-games:
        backup:
          repository: iso
      qbittorrent-musics:
        backup:
          repository: iso
      qbittorrent-oses:
        backup:
          repository: iso
      qbittorrent-softwares:
        backup:
          repository: iso
      qbittorrent-movies:
        backup:
          repository: iso
      qbittorrent-shows:
        backup:
          repository: iso
      starr-movies-torrents:
        backup: false
      starr-shows-torrents:
        backup: false
services:
  qbittorrent:
    config:
      traefik:
        dynamic:
          traefik:
            service:
              port:
                env: WEBUI_PORT
    keepasses:
      keepass:
        hostname:
          hostname: qbittorrent
    network:
      vpn:
        ports:
          port:
    container:
      image: qbittorrent
      hosts:
        - hostname: xseed
      network:
        container: vpn
      tmpfs:
        - path: /run
          exec: true
      volumes:
        qbittorrent-config: /config
        qbittorrent-archives: /media/archives/sources/torrents
        qbittorrent-books: /media/books/sources/torrents
        qbittorrent-documents: /media/documents/sources/torrents
        qbittorrent-games: /media/games/sources/torrents
        qbittorrent-musics: /media/musics/sources/torrents
        qbittorrent-oses: /media/oses/sources/torrents
        qbittorrent-softwares: /media/softwares/sources/torrents
        qbittorrent-movies: /media/movies/sources/torrents
        qbittorrent-shows: /media/shows/sources/torrents
        starr-movies-torrents: /media/movies/starr/sources/torrents
        starr-shows-torrents: /media/shows/starr/sources/torrents
      envs:
        S6_READ_ONLY_ROOT: 1
        WEBUI_PORT: 8080
        TORRENTING_PORT:
          port:
