docker:
  images:
    remote:
      jdownloader:
        repo: antlafarge/jdownloader
        tag: "alpine-openjdk21"
  volumes:
    local:
      jdownloader-config: {}
      jdownloader-logs: {}
      jdownloader-musics:
        backup:
          repository: iso
      jdownloader-movies:
        backup:
          repository: iso
      jdownloader-shows:
        backup:
          repository: iso
services:
  jdownloader:
    config: {}
    network:
      bridge:
    container:
      image: jdownloader
      network:
        bridge:
          vpn: {}
      read-only: false
      volumes:
        jdownloader-config: /jdownloader/cfg
        jdownloader-logs: /jdownloader/logs
        jdownloader-musics: /media/musics
        jdownloader-movies: /media/movies
        jdownloader-shows: /media/shows
      envs:
        JD_EMAIL:
        JD_PASSWORD:
        JD_DEVICENAME:
          hvariable: FULL_HOSTNAME
