[project]
name = "homelab-hatchet-worker-docker"
version = "0.1.0"
requires-python = ">=3.15.2"
dependencies = [
    "hatchet-sdk[otel]>=1.46.0",
    "homelab-hatchet-tool",
    "watchfiles>=1.1.1",
    "pydantic>=2.10.6",
    "croniter>=6.2.2",
    "python-dateutil>=2.9.0.post0",
    "pip-system-certs>=5.3",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.sources]
homelab-pydantic = { workspace = true }
homelab-hatchet-tool = { workspace = true }

[tool.uv.workspace]
members = ["homelab-*"]

[project.scripts]
homelab-hatchet-worker = "homelab_hatchet_worker_docker:main"
